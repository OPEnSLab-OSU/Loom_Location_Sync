<div class="container">

    <header>
        <div>
            <h1>Device Tracking Dashboard</h1>
            <div class="subtitle">Live MongoDB Location Feed</div>
        </div>
    </header>

    <div class="grid">
        <div class="card">
            <h3>Total Devices</h3>
            <p>{{ total_devices }}</p>
        </div>

        <div class="card">
            <h3>Updated</h3>
            <p>{{ updated_count }}</p>
        </div>
    </div>

    <div class="map-container">
        {{ map_html|safe }}
    </div>

</div>
