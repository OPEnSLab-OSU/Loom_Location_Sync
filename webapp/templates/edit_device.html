<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<div class="container">

    <nav class="nav">
        <a href="/">Home</a>
        <a href="/devices">Devices</a>
    </nav>

    <div class="card">
        <h1>Edit Device</h1>

        <form method="POST">
            <label>Latitude</label>
            <input
                type="number"
                step="any"
                name="latitude"
                value="{{ device.latitude }}"
                required
            >

            <label>Longitude</label>
            <input
                type="number"
                step="any"
                name="longitude"
                value="{{ device.longitude }}"
                required
            >

            <br><br>

            <button type="submit">
                Update Location
            </button>
        </form>
    </div>

</div>
